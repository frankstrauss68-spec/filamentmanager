<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FilamentManager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('spools.index') }}">
      <i class="bi bi-layers-fill me-2"></i>FilamentManager
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'spools' %}active{% endif %}"
             href="{{ url_for('spools.index') }}">
            <i class="bi bi-grid me-1"></i>Spulen
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'locations' %}active{% endif %}"
             href="{{ url_for('locations.index') }}">
            <i class="bi bi-geo-alt me-1"></i>Lagerorte
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'printers' %}active{% endif %}"
             href="{{ url_for('printers.index') }}">
            <i class="bi bi-printer me-1"></i>Drucker
          </a>
        </li>
      </ul>
      <a class="btn btn-primary btn-sm" href="{{ url_for('spools.new_spool') }}">
        <i class="bi bi-plus-lg me-1"></i>Neue Spule
      </a>
    </div>
  </div>
</nav>

<main class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
